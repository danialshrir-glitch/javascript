<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JavaScript Experimenting Site</title>
        <link rel="stylesheet" href="styles/general-styles.css" />
        <link rel="stylesheet" href="styles/home-page-styles.css" />
        <link rel="stylesheet" href="styles/cards-creation-deletion-page-styles.css" />
        <link rel="stylesheet" href="styles/cards-filtering-page.css" />
        <link rel="stylesheet" href="styles/algorithms-page-styles.css" />
        <link rel="stylesheet" href="styles/recursion-page-styles.css" />
        <link rel="stylesheet" href="styles/tic-tac-toe-page-styles.css" />
        <script src="scripts/home-page-script.js" defer></script>
        <script src="scripts/show-hide-divs.js" defer></script>
        <script src="scripts/card-creation-script.js" defer></script>
    </head>
    <body>
        <header>
            <div class="separator">
                <div id="page-title">
                    <h1>JS first website</h1>
                </div>
                <div id="header-navigation">
                    <nav>
                        <ul>
                            <li><button id="show-home-page">Home</button></li>
                            <li><button id="show-cards-creation-deletion-page">Cards creation/deletion</button></li>
                            <li><button id="show-cards-filtering-page">Cards filtering</button></li>
                            <li><button id="show-algorithms-page">Algorithms</button></li>
                            <li><button id="show-recursion-page">Recursion</button></li>
                            <li><button id="show-tic-tac-toe-page">Tic-Tac-Toe</button></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <div id="home-page">
            <h1>WELCOME!</h1>
            <main>
                <div id="current-time">
                    Current time: <span id="clock"></span>.
                </div>
                <div id="current-date">
                    Current date: <span id="date"></span>.
                </div>
                <div id="greeting-message">
                    Greetings! Welcome to my first JavaScript site!
                </div>
            </main>
        </div>

        <div id="cards-creation-deletion-page">
            <h1>Create/Delete cards</h1>
            <form>
                <input type="text" id="full-name" placeholder="Full Name" />
                <input type="email" id="email" placeholder="Email address" required />
                <button type="button">Create card</button>
            </form>
            <section></section>
        </div>

        <div id="cards-filtering-page">
            <h1>Filter cards</h1>
            <div class="separator">
                <select>
                    <option value="age">Age</option>
                    <option value="name">Name</option>
                    <option value="admin">Admin</option>
                    <option value="grades">Grades</option>
                    <option value="address">Address</option>
                </select>
                <input type="text" name="search-bar" />
                <button>Find</button>
                <button>Reset</button>
                <button>Sort</button>
                <button>Reverse</button>
            </div>
            <section></section>
        </div>

        <div id="algorithms-page">
            <h1>Algorithms</h1>
            <div class="separator">
                <section id="algorithms-1">
                    <h2>Example algorithms:</h2>
                    <div class="separator">
                        <label>Choose your algorithm:&nbsp;</label>
                        <select>
                            <option value="palindrome">Palindrome</option>
                            <option value="prime">Prime</option>
                            <option value="password">Password</option>
                            <option value="unique">Unique</option>
                        </select>
                        <input type="text" name="string1" />
                    </div>
                </section>
                <section id="algorithms-2">
                    <h2>Encryption/Decryption algorithms:</h2>
                    <div class="separator">
                        <input type="text" name="encryption-decryption-algorithm" placeholder="Text" />
                        <input type="number" name="chars-to-move" placeholder="Number" />
                        <button>Encrypt</button>
                        <button>Decrypt</button>
                    </div>
                </section>
            </div>
        </div>

        <div id="recursion-page">
            <h1>Recursion</h1>
            <div class="separator">
                <input type="number" name="recursion-number" placeholder="Enter a number" />
                <select>
                    <option value="factorial">Factorial</option>
                    <option value="fibonacci">Fibonacci</option>
                </select>
                <select>
                    <option value="iterative">Iterative</option>
                    <option value="recursive">Recursive</option>
                </select>
            </div>
        </div>

        <div id="tic-tac-toe-page">
            <h1>Tic-Tac-Toe</h1>
            <div class="tic-tac-toe-game"></div>
        </div>
    </body>
</html>
